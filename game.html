<!--
  [INPUT]: 依赖 story-sangu.js 提供的 window.STORY（场景/分数/开关/信件/结局）
  [OUTPUT]: 双击即玩的文字选择游戏：进度/选项/承接句/结局判定/通关档案
  [POS]: war_shape 的引擎文件；story-sangu.js 是内容，本文件是玩法。以后加剧本只需换 STORY 数据
  [PROTOCOL]: 改机制（新分数/新算法）改本文件；改剧情去改 story-sangu.js
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>war_shape · 三顾茅庐前</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", serif; background: #1a1512; color: #e8dcc8; margin: 0; padding: 20px; }
  #app { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; letter-spacing: 4px; }
  .sub { text-align: center; color: #a89880; font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; justify-content: space-between; background: #2a231d; border: 1px solid #4a3f30; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }
  .scene { background: #241e18; border: 1px solid #4a3f30; border-radius: 10px; padding: 18px; margin-bottom: 12px; }
  .scene h2 { font-size: 17px; margin: 0 0 10px; color: #f0c96a; }
  .scene p { line-height: 1.9; font-size: 15px; }
  .echo { color: #c9b896; }
  button.opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px; font-size: 15px;
    background: #33291f; color: #e8dcc8; border: 1px solid #6a5a44; border-radius: 8px; cursor: pointer; }
  button.opt:hover { background: #453823; border-color: #f0c96a; }
  .card { background: #241e18; border: 2px solid #f0c96a; border-radius: 10px; padding: 18px; }
  .card h2 { color: #f0c96a; margin-top: 0; }
  .card li { line-height: 1.9; font-size: 14px; }
  .row { text-align: center; margin-top: 14px; }
  button.big { padding: 10px 22px; margin: 0 6px; font-size: 15px; border-radius: 8px; cursor: pointer;
    background: #f0c96a; color: #1a1512; border: none; }
  button.ghost { background: transparent; color: #a89880; border: 1px solid #4a3f30; }
</style>
</head>
<body>
<div id="app"></div>
<script src="story-sangu.js"></script>
<script>
(function () {
  var S = window.STORY;
  var state;

  function reset() {
    state = { i: 0, score: { ren: 0, ba: 0, zhi: 0 }, flags: {}, letters: [], lastMainDim: "ren", echo: null };
    render();
  }

  function dimName(d) { return d === "ren" ? "仁" : d === "ba" ? "霸" : "智"; }

  function render() {
    var app = document.getElementById("app");
    if (state.i >= S.scenes.length) { renderEnding(app); return; }
    var sc = S.scenes[state.i];
    var totalActs = 4;
    var html = "<h1>" + S.title + "</h1><div class='sub'>" + S.subtitle + "</div>";
    html += "<div class='bar'><span>第 " + sc.act + " 幕 / 共 " + totalActs + " 幕</span></div>";
    html += "<div class='scene'><h2>" + sc.title + "</h2>";
    // 上一选择的承接句：长进正文开头，主框只留故事
    if (state.echo) { html += "<p class='echo'>" + state.echo + "</p>"; state.echo = null; }
    html += "<p>" + sc.text + "</p>";
    // 拆信：之前埋的信，到了约定的幕就变成正文里的一段对话
    state.letters.forEach(function (id) {
      var L = S.letters[id];
      if (!state["fired_" + id] && sc.act >= L.fireAct) {
        html += "<p>" + L.text + "</p>";
        state["fired_" + id] = true;
        state.flags["letter_" + id] = true;
      }
    });
    html += "<div id='opts'>";
    sc.options.forEach(function (op, idx) {
      html += "<button class='opt' data-idx='" + idx + "'>" + op.text + "</button>";
    });
    html += "</div></div>";
    app.innerHTML = html;
    var btns = app.querySelectorAll("button.opt");
    btns.forEach(function (b) {
      b.addEventListener("click", function () { choose(sc, sc.options[+b.getAttribute("data-idx")]); });
    });
  }

  function choose(sc, op) {
    Object.keys(op.score).forEach(function (k) { state.score[k] += op.score[k]; });
    if (op.flag) state.flags[op.flag] = true;
    if (op.letter && state.letters.indexOf(op.letter) < 0) state.letters.push(op.letter);
    if (sc.kind === "main") {
      // 记录最后一道主菜的方向，打平用它定归属
      var best = "ren", bestV = -1;
      ["ren", "ba", "zhi"].forEach(function (k) {
        var v = op.score[k] || 0;
        if (v > bestV) { bestV = v; best = k; }
      });
      state.lastMainDim = best;
    }
    // 承接句留给下一幕开头，节奏仍由玩者亲手点"继续"
    state.echo = op.echo || null;
    var opts = document.getElementById("opts");
    opts.querySelectorAll("button").forEach(function (b) { b.disabled = true; b.style.opacity = "0.55"; });
    // 反馈由玩者亲手点"继续"再往下走，不自动跳
    var next = document.createElement("button");
    next.className = "opt";
    next.textContent = "继续 →";
    next.addEventListener("click", function () { state.i++; render(); });
    opts.appendChild(next);
  }

  function renderEnding(app) {
    var s = state.score, dim = "ren", top = s.ren;
    if (s.ba > top) { dim = "ba"; top = s.ba; }
    if (s.zhi > top) { dim = "zhi"; top = s.zhi; }
    // 打平：看最后一道主菜
    var tied = (s.ren === top ? 1 : 0) + (s.ba === top ? 1 : 0) + (s.zhi === top ? 1 : 0) > 1;
    if (tied) dim = state.lastMainDim;
    var ed = S.endings[dim];
    var html = "<h1>结局 · " + ed.name + "</h1>";
    // 最后一幕的承接句变成结局的开头引子
    var lead = state.echo ? "<p class='echo'>" + state.echo + "</p>" : "";
    html += "<div class='card'>" + lead + "<p style='line-height:2'>" + ed.text + "</p><ul>";
    S.flagOrder.forEach(function (f) {
      if (state.flags[f] && S.endingExtras[f]) html += "<li>" + S.endingExtras[f] + "</li>";
    });
    html += "</ul>";
    html += "<p style='color:#a89880;font-size:13px'>通关档案：仁 " + s.ren + " · 霸 " + s.ba + " · 智 " + s.zhi
      + "（" + ed.name + "）——下一剧本开场会读这张卡。</p>";
    html += "<div class='row'><button class='big' id='again'>再走一次</button>"
      + "<button class='big ghost' id='copy'>复制档案</button></div></div>";
    app.innerHTML = html;
    document.getElementById("again").addEventListener("click", reset);
    document.getElementById("copy").addEventListener("click", function () {
      var txt = "【war_shape通关档案】" + ed.name + "｜仁" + s.ren + "霸" + s.ba + "智" + s.zhi;
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      this.textContent = "已复制！";
    });
  }

  reset();
})();
</script>
</body>
</html>
