<!--
  [INPUT]: 依赖 engine.js（玩法） + story-changban.js（剧本数据）
  [OUTPUT]: 长坂坡剧本的壳：双击即玩，开场可读三顾茅庐前通关档案
  [POS]: war_shape 的剧本壳之一；与 game.html 同形，只换标题和剧本引用
  [PROTOCOL]: 改机制去改 engine.js；改剧情去改 story-changban.js；本文件只换标题和引用
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>war_shape · 长坂坡</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", serif; background: #1a1512; color: #e8dcc8; margin: 0; padding: 20px; }
  #app { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; letter-spacing: 4px; }
  .sub { text-align: center; color: #a89880; font-size: 14px; margin-bottom: 16px; }
  .bar { display: flex; justify-content: space-between; background: #2a231d; border: 1px solid #5a4c38; border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: bold; color: #f0c96a; margin-bottom: 12px; }
  .scene { background: #241e18; border: 1px solid #5a4c38; border-radius: 10px; padding: 20px; margin-bottom: 12px; }
  .scene h2 { font-size: 19px; margin: 0 0 12px; color: #f0c96a; }
  .scene p { line-height: 2; font-size: 17px; }
  .echo { color: #d8c49a; border-left: 3px solid #f0c96a; background: #2a231d; border-radius: 0 8px 8px 0; padding: 8px 12px; }
  button.opt { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px; font-size: 16px; line-height: 1.6;
    background: #33291f; color: #e8dcc8; border: 1px solid #7a684f; border-radius: 8px; cursor: pointer; }
  button.opt:hover { background: #453823; border-color: #f0c96a; }
  button.opt:active { background: #4d4028; transform: translateY(1px); }
  button.opt:focus-visible { outline: 2px solid #f0c96a; outline-offset: 2px; }
  .card { background: #241e18; border: 2px solid #f0c96a; border-radius: 10px; padding: 20px; }
  .card h2 { color: #f0c96a; margin-top: 0; }
  .card li { line-height: 2; font-size: 16px; }
  .card p { font-size: 16px; }
  .row { text-align: center; margin-top: 16px; }
  button.big { padding: 12px 26px; margin: 4px 8px; font-size: 16px; border-radius: 8px; cursor: pointer;
    background: #f0c96a; color: #1a1512; border: none; }
  button.big:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: #a89880; border: 1px solid #5a4c38; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    h1 { font-size: 20px; }
    .scene, .card { padding: 14px; }
    button.opt { padding: 14px 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="story-changban.js"></script>
<script src="engine.js"></script>
</body>
</html>
